<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pace.ai</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--text:#171717;--muted:#777;--line:rgba(0,0,0,.08);--bubble:#111;--shadow:0 18px 60px rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,textarea,select{font:inherit}.app{height:100%;display:flex}
.sidebar{width:280px;background:rgba(255,255,255,.72);backdrop-filter:blur(24px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px;z-index:10}
.brand{font-size:25px;font-weight:700;letter-spacing:-.8px;padding:8px 10px 18px}
.new-chat{padding:12px;border:0;border-radius:14px;background:#111;color:#fff;cursor:pointer}
.chat-list{flex:1;overflow:auto;margin-top:14px}.chat-item{width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item:hover,.chat-item.active{background:rgba(0,0,0,.06)}.account{border-top:1px solid var(--line);padding-top:13px;color:var(--muted);font-size:13px}
.account button{background:none;border:0;padding:8px 0;cursor:pointer}.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;justify-content:flex-end;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.48);backdrop-filter:blur(20px)}
.model-select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;outline:0}
.messages{flex:1;overflow:auto;padding:38px 24px 170px}.row{max-width:900px;margin:0 auto 24px;display:flex}.row.user{justify-content:flex-end}
.bubble{max-width:min(760px,90%);padding:14px 17px;border-radius:20px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.user .bubble{background:#111;color:#fff;border-bottom-right-radius:6px}.assistant .bubble{padding-left:0;padding-right:0;background:transparent}
.copy{display:block;margin-top:8px;background:none;border:0;color:#888;font-size:12px;padding:0;cursor:pointer}
.composer-wrap{position:fixed;left:280px;right:0;bottom:0;padding:18px 24px 22px;background:linear-gradient(transparent,rgba(245,245,247,.97) 28%)}
.composer{max-width:900px;margin:auto;display:flex;gap:10px;align-items:flex-end;background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:10px}
textarea{flex:1;border:0;outline:0;background:transparent;resize:none;max-height:180px;padding:9px;line-height:1.45}
.send{width:42px;height:42px;border:0;border-radius:13px;background:#111;color:#fff;cursor:pointer}.send:disabled{opacity:.35}
.auth{position:fixed;inset:0;background:rgba(245,245,247,.95);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:30px}
.card h1{margin:0 0 7px;font-size:30px}.card p{color:var(--muted);margin:0 0 22px}.card input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:#fafafa;outline:0}
.primary{width:100%;padding:13px;border:0;border-radius:13px;background:#111;color:#fff;cursor:pointer}.status{min-height:18px;color:#c33;font-size:13px;margin:8px 0}
.switch{text-align:center;margin-top:14px;color:var(--muted);font-size:13px}.switch button{border:0;background:none;text-decoration:underline;cursor:pointer}
.welcome{text-align:center;max-width:700px;margin:20vh auto;color:#777}.welcome h2{font-size:34px;color:#222;letter-spacing:-1px}
.menu{display:none}
@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0);box-shadow:20px 0 60px rgba(0,0,0,.15)}.menu{display:block;margin-right:auto;border:0;background:none;font-size:22px}.topbar{justify-content:flex-end}.composer-wrap{left:0;padding:14px}.messages{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div id="auth" class="auth"></div>
<div id="app" class="app" hidden>
<aside id="side" class="sidebar">
<div class="brand">Pace.ai</div>
<button id="new" class="new-chat">＋ New chat</button>
<div id="chats" class="chat-list"></div>
<div class="account"><div id="name"></div><button id="logout">Sign out</button></div>
</aside>
<main class="main">
<header class="topbar"><button id="menu" class="menu">☰</button>
<select id="model" class="model-select">
<optgroup label="OpenAI">
<option value="gpt-5-mini">Pace Swift · Fast everyday AI</option>
<option value="gpt-5-mini">Pace Core · General-purpose AI</option>
<option value="gpt-5-mini">Pace Reason · Advanced reasoning</option>
</optgroup>
<optgroup label="Coming soon">
<option disabled>Pace Apex · Highest-performance Pace model</option>
<option disabled>Pace Gemini Swift</option><option disabled>Pace Gemini Pro</option><option disabled>Pace Gemini Ultra</option>
<option disabled>Pace Claude Swift</option><option disabled>Pace Claude Sonnet</option><option disabled>Pace Claude Opus</option>
</optgroup>
</select></header>
<section id="messages" class="messages"></section>
<div class="composer-wrap"><form id="form" class="composer">
<textarea id="input" rows="1" placeholder="Message Pace…"></textarea><button id="send" class="send">↑</button>
</form></div>
</main>
</div>
<script>
const BACKEND="https://script.google.com/macros/s/AKfycbyURUhNQdsa_rvCYYakL06gVFVAY0HrkKizfJIEyXOJmpoXp7UUkG5AnEeDkzR8C0ymdA/exec";
const S={token:localStorage.getItem("pace_token")||"",user:null,chat:null,chats:[],busy:false};
const $=id=>document.getElementById(id);

async function api(action,extra={}){
  const body=Object.assign({action},extra);
  if(S.token)body.token=S.token;
  const r=await fetch(BACKEND,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const t=await r.text();
  let d;try{d=JSON.parse(t)}catch(e){throw Error("Backend returned invalid data.")};
  if(!d.ok)throw Error(d.error||"Request failed.");
  return d;
}
function authScreen(register=false,error=""){
  $("auth").innerHTML=`<div class="card"><h1>${register?"Create your Pace":"Welcome to Pace"}</h1>
  <p>${register?"Create an account with Drive-backed history and memory.":"Sign in to continue."}</p>
  <form id="authForm">${register?'<input id="display" placeholder="Name" autocomplete="name">':""}
  <input id="email" type="email" placeholder="Email" autocomplete="email" required>
  <input id="pw" type="password" placeholder="Password" autocomplete="${register?"new-password":"current-password"}" required>
  <div class="status">${String(error).replace(/</g,"&lt;")}</div><button class="primary">${register?"Create account":"Sign in"}</button></form>
  <div class="switch">${register?"Already have an account?":"Need an account?"} <button type="button" id="switch">${register?"Sign in":"Create one"}</button></div></div>`;
  $("switch").onclick=()=>authScreen(!register);
  $("authForm").onsubmit=async e=>{
    e.preventDefault();e.submitter.disabled=true;
    try{
      const d=await api(register?"register":"login",{email:$("email").value,password:$("pw").value,displayName:register?$("display").value:""});
      S.token=d.token;S.user=d.user;localStorage.setItem("pace_token",S.token);await start();
    }catch(err){authScreen(register,err.message)}
  };
}
async function start(){
  $("auth").hidden=true;$("app").hidden=false;$("name").textContent=S.user.displayName||S.user.email;
  await refresh();
  if(!S.chat){S.chat=(await api("newChat")).chat}
  render();
}
async function refresh(){S.chats=(await api("listChats")).chats||[];renderChats()}
function renderChats(){
  $("chats").innerHTML="";
  S.chats.forEach(c=>{const b=document.createElement("button");b.className="chat-item"+(S.chat&&S.chat.id===c.id?" active":"");b.textContent=c.title||"New chat";
    b.onclick=async()=>{S.chat=(await api("getChat",{chatId:c.id})).chat;renderChats();render();$("side").classList.remove("open")};$("chats").appendChild(b)})
}
function render(){
  const box=$("messages");box.innerHTML="";
  if(!S.chat||!S.chat.messages.length){box.innerHTML='<div class="welcome"><h2>How can I help?</h2><div>Ask Pace anything.</div></div>';return}
  S.chat.messages.forEach(m=>{
    const row=document.createElement("div");row.className="row "+m.role;
    const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=m.content||"";row.appendChild(bubble);
    if(m.role==="assistant"){const c=document.createElement("button");c.className="copy";c.textContent="Copy";c.onclick=async()=>{try{await navigator.clipboard.writeText(m.content||"");c.textContent="Copied";setTimeout(()=>c.textContent="Copy",900)}catch(e){c.textContent="Copy failed"}};bubble.appendChild(c)}
    box.appendChild(row)
  });box.scrollTop=box.scrollHeight
}
async function send(){
  if(S.busy)return;const input=$("input"),text=input.value.trim();if(!text)return;
  if(!S.chat)S.chat=(await api("newChat")).chat;
  S.busy=true;$("send").disabled=true;input.value="";input.style.height="auto";
  S.chat.messages.push({role:"user",content:text,createdAt:new Date().toISOString()});render();
  try{S.chat=(await api("sendMessage",{chatId:S.chat.id,message:text,model:$("model").value})).chat;await refresh();render()}
  catch(e){S.chat.messages.push({role:"assistant",content:"Sorry — "+e.message});render()}
  finally{S.busy=false;$("send").disabled=false;input.focus()}
}
$("form").onsubmit=e=>{e.preventDefault();send()};
$("input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
$("input").oninput=()=>{$("input").style.height="auto";$("input").style.height=Math.min($("input").scrollHeight,180)+"px"};
$("new").onclick=async()=>{S.chat=(await api("newChat")).chat;await refresh();render()};
$("logout").onclick=async()=>{try{await api("logout")}catch(e){}localStorage.removeItem("pace_token");location.reload()};
$("menu").onclick=()=>$("side").classList.toggle("open");

(async function(){
  if(!BACKEND||BACKEND.includes("https://script.google.com/macros/s/AKfycbyURUhNQdsa_rvCYYakL06gVFVAY0HrkKizfJIEyXOJmpoXp7UUkG5AnEeDkzR8C0ymdA/exec")){authScreen(false,"Backend URL is not configured.");return}
  if(!S.token){authScreen(false);return}
  try{S.user=(await api("me")).user;await start()}catch(e){localStorage.removeItem("pace_token");S.token="";authScreen(false,"Please sign in again.")}
})();
</script>
</body>
</html>
